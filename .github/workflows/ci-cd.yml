# 1) Workflow nomi
name: CI/CD Pipeline

# 2) QACHON ishga tushadi? (trigger)
on:
  push:
    branches: [ "main" ]      # main'ga push bo'lganda

# 3) JOBLAR (vazifalar)
jobs:
  test: # job nomi
    runs-on: ubuntu-latest    # qaysi OS'da ishlaydi

    steps: # qadamlar
      - name: Kodni olish
        uses: actions/checkout@v4   # tayyor action

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) Kutubxonalarni o'rnatish
      - name: 📦 Requirements o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test qilish
        env:
          SECRET_KEY: "test-secret-key-faqat-ci-uchun"
          DEBUG: "False"
          DB_NAME: u13_django
          DB_USER: giyos
          DB_PASSWORD: 12
          DB_HOST: db
          DB_PORT: 5432
          GOOGLE_CLIENT_ID: "test-client-id"
          GOOGLE_CLIENT_SECRET: "test-client-secret"
        run: python manage.py test   # oddiy terminal buyrug'i


  # ==========================================================
  #  2-JOB:  BUILD & PUSH  (CD qismi)
  #  Faqat test o'tsa VA main'ga push bo'lsa ishlaydi
  # ==========================================================
  build-and-push:
    name: 🚀 Build & Push (CD)
    runs-on: ubuntu-latest
    needs: test                                  # test'ga bog'liq
    if: github.event_name == 'push'              # PR'da push qilmaydi

    steps:
      - name: 📥 Kodni checkout qilish
        uses: actions/checkout@v4

      # Docker Hub'ga login (sirlar Settings > Secrets'da saqlanadi)
      - name: 🔐 Docker Hub'ga login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image build qilib, Docker Hub'ga push qilish
      - name: 🏗️ Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/u13_django:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/u13_django:${{ github.sha }}

  # ==========================================================
  #  3-JOB:  DEPLOY  (serverga chiqarish — CD ning oxiri)
  #  Faqat image push bo'lgandan keyin ishlaydi
  # ==========================================================
  deploy:
    name: 🌐 Deploy (Serverga)
    runs-on: ubuntu-latest
    needs: build-and-push          # image tayyor bo'lsagina
    if: github.event_name == 'push'

    steps:
      - name: 🔑 SSH orqali serverga ulanib, deploy qilish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}      # server IP/domen
          username: ${{ secrets.SERVER_USER }}  # ssh user (root/ubuntu)
          key: ${{ secrets.SERVER_SSH_KEY }}    # ssh private key
          port: 22
          script: |
            cd /home/ubuntu/u13_django_devops           # serverdagi loyiha papkasi
            sudo docker compose pull                 # yangi image'ni tort
            sudo docker compose up -d                # qayta ishga tushir
            sudo docker image prune -f               # eski image'larni tozala